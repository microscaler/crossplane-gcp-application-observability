name: Publish Provider Package

# Builds the provider image and Crossplane package for linux/amd64 and linux/arm64 and pushes the package to
# ghcr.io/microscaler/provider-gcpobservability. Run by hand with a version, or by pushing a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v0.1.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  XPKG_REG_ORGS: ghcr.io/microscaler
  XPKG_REG_ORGS_NO_PROMOTE: ghcr.io/microscaler
  REGISTRY_ORGS: ghcr.io/microscaler

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: make -j2 build.all

      - name: Publish
        run: make -j2 publish BRANCH_NAME=main
