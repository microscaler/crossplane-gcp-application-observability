kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workloadregistrations.apphub.gcpobservability.microscaler.io
spec:
  group: apphub.gcpobservability.microscaler.io
  names:
    categories:
    - crossplane
    - managed
    - gcpobservability
    kind: WorkloadRegistration
    listKind: WorkloadRegistrationList
    plural: workloadregistrations
    singular: workloadregistration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .spec.forProvider.applicationId
      name: APPLICATION
      type: string
    - jsonPath: .status.atProvider.selected
      name: SELECTED
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkloadRegistration registers the App Hub discovered workloads of a GKE
          cluster's namespaces to an application, and keeps the registration in step
          as workloads come and go.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkloadRegistrationSpec defines the desired state of WorkloadRegistration.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: |-
                  WorkloadRegistrationParameters select GKE workloads that App Hub has
                  discovered and register them to an application. App Hub assigns discovered
                  workloads opaque IDs, so they are selected by cluster, namespace and kind
                  rather than named one by one.
                properties:
                  adoptDescriptions:
                    description: |-
                      AdoptDescriptions lists workload descriptions written by earlier tooling.
                      Workloads in the application carrying one of them are taken over by this
                      registration, as if it had created them.
                    items:
                      type: string
                    type: array
                  applicationId:
                    description: ApplicationID of the App Hub application the workloads
                      are registered to.
                    type: string
                  attributes:
                    description: Attributes set on each registered workload.
                    properties:
                      businessOwners:
                        items:
                          description: Owner of an App Hub application or workload.
                          properties:
                            displayName:
                              description: DisplayName of the owner. Defaults to the
                                local part of the email.
                              type: string
                            email:
                              description: Email address of the owner.
                              type: string
                          required:
                          - email
                          type: object
                        type: array
                      criticality:
                        description: 'Criticality type: MISSION_CRITICAL, HIGH, MEDIUM
                          or LOW.'
                        enum:
                        - MISSION_CRITICAL
                        - HIGH
                        - MEDIUM
                        - LOW
                        type: string
                      developerOwners:
                        items:
                          description: Owner of an App Hub application or workload.
                          properties:
                            displayName:
                              description: DisplayName of the owner. Defaults to the
                                local part of the email.
                              type: string
                            email:
                              description: Email address of the owner.
                              type: string
                          required:
                          - email
                          type: object
                        type: array
                      environment:
                        description: 'Environment type: PRODUCTION, STAGING, TEST
                          or DEVELOPMENT.'
                        enum:
                        - PRODUCTION
                        - STAGING
                        - TEST
                        - DEVELOPMENT
                        type: string
                      operatorOwners:
                        items:
                          description: Owner of an App Hub application or workload.
                          properties:
                            displayName:
                              description: DisplayName of the owner. Defaults to the
                                local part of the email.
                              type: string
                            email:
                              description: Email address of the owner.
                              type: string
                          required:
                          - email
                          type: object
                        type: array
                    type: object
                  cluster:
                    description: Cluster is the name of the GKE cluster whose workloads
                      are selected.
                    type: string
                  clusterProject:
                    description: |-
                      ClusterProject restricts the selection to workloads in this project
                      (project ID). Useful when several projects have a cluster of the same name.
                    type: string
                  exclude:
                    description: Exclude names workloads (by name, any namespace)
                      that are never selected.
                    items:
                      type: string
                    type: array
                  kinds:
                    description: |-
                      Kinds of workload selected: Deployment, StatefulSet, DaemonSet, CronJob.
                      Defaults to Deployment and StatefulSet.
                    items:
                      type: string
                    type: array
                  location:
                    description: Location of the application, for example us-east4.
                    type: string
                  namespaces:
                    description: Namespaces whose workloads are selected.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  project:
                    description: |-
                      Project hosting App Hub (the host project). Defaults to the projectID of
                      the ProviderConfig.
                    type: string
                required:
                - applicationId
                - cluster
                - location
                - namespaces
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
          status:
            description: WorkloadRegistrationStatus defines the observed state of
              WorkloadRegistration.
            properties:
              atProvider:
                description: WorkloadRegistrationObservation is the observed state.
                properties:
                  conflicts:
                    description: Conflicts lists selected workloads already registered
                      elsewhere.
                    items:
                      type: string
                    type: array
                  registered:
                    description: Registered lists the IDs of the workloads this registration
                      owns.
                    items:
                      type: string
                    type: array
                  selected:
                    description: Selected is the number of discovered workloads the
                      selector matches.
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
