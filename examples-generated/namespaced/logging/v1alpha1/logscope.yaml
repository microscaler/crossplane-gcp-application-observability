apiVersion: logging.gcpobservability.m.microscaler.io/v1alpha1
kind: LogScope
metadata:
  annotations:
    meta.upbound.io/example-id: logging/v1alpha1/logscope
  labels:
    testing.upbound.io/example-name: logging_log_scope
  name: logging-log-scope
  namespace: crossplane-system
spec:
  forProvider:
    description: A log scope configured with Terraform
    location: global
    parent: projects/my-project-name
    resourceNames:
    - projects/my-project-name
    - projects/my-project-name/locations/global/buckets/_Default/views/view1
    - projects/my-project-name/locations/global/buckets/_Default/views/view2
